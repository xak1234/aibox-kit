# llama-swap config for aibox (https://github.com/mostlygeek/llama-swap).
# gen_models.py rewrites ONLY the AUTO-GENERATED block, every 30 s when files change.
# Put your own hand-tuned entries above it (they win over the auto entry for the same file), e.g.:
#
#   "my-model":
#     cmd: "${llama} -m /srv/aibox/models/my-model/My-Model-Q4_K_M.gguf -c 65536 --temp 0.6 ${common}"
#     aliases: ["mine"]
#
healthCheckTimeout: 300
logLevel: info

macros:
  llama: "@LLAMA_SERVER@"
  common: "-ngl 99 -fa on -ctk q8_0 -ctv q8_0 -np 1 --jinja -ub 1024 -b 2048 --host 127.0.0.1 --port ${PORT}"
  common_auto: "-ngl 99 -fa on -ctk q8_0 -ctv q8_0 -np 1 --jinja -ub 1024 -b 2048 --host 127.0.0.1 --port ${PORT}"

models:
  # BEGIN AUTO-GENERATED by gen_models.py (edit the generator, not this block)
  # END AUTO-GENERATED
