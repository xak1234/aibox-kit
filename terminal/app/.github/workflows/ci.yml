name: Validate terminal workspace
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run build
      - run: ruff check terminal_app tests scripts/restore.py scripts/smoke-runtime.py
      - run: mypy terminal_app
      - run: python -m pytest -q
      - run: harness2-demo --output /tmp/harness2-check --k 1
      - run: docker compose up --build -d --wait --wait-timeout 120
      - run: docker compose exec -T terminal python scripts/smoke-runtime.py
      - if: always()
        run: docker compose logs --tail=100 && docker compose down
